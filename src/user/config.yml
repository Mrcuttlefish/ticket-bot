# upload the bot's own button icons as application emojis, instead of using standard emojis
icons: true
logs:
  files:
    directory: ./logs
    enabled: true
    keepFor: 30
  level: info
presence:
  activities:
    # type: 0 playing, 2 listening, 3 watching, 4 custom status (just the text), 5 competing
    - name: /new
    - name: with {totalTickets} tickets
    - name: "{openTickets} tickets"
      type: 3
    - name: "{avgResponseTime} response time"
      type: 3
    - name: "{avgRating} ⭐ rating"
      type: 3
  interval: 20
  status: online
stats: true
tickets:
  # what goes in a ticket channel's topic (anyone who can see the audit log can see it):
  # full ("@creator | topic"), topic, creator, or none
  channelTopic: full
templates:
  transcript: transcript.md
updates: true
